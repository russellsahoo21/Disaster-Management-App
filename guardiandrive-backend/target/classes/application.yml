spring:
  application:
    name: guardiandrive-backend
  datasource:
    url: jdbc:h2:mem:guardiandrive;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

google:
  client-id: "650827962018-hphg7f2c4umgkpucsvm5arjs3l7lfu2j.apps.googleusercontent.com"
